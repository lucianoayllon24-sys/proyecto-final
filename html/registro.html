<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro | Cineverse</title>
  <link rel="icon" type="image/svg+xml" href="../Favicon/favicon.svg" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/registro.css" />
</head>
<body>

  <header>
    <a href="../index.html" class="logo"><img src="../Favicon/favicon.svg" alt="" width="32" height="32" /> CINEVERSE</a>
    <nav>
      <a href="../index.html">Inicio</a>
      <a href="cartelera.html">Cartelera</a>
      <a href="confiteria.html">Confitería</a>
      <a href="sedes.html">Sedes</a>
      <a href="contacto.html">Contacto</a>
      <a href="registro.html" class="activo">Registro</a>
    </nav>
  </header>

  <main class="registro">
    <h1>Crea tu cuenta</h1>
    <form id="formRegistro" novalidate>
      <label>Nombre completo
        <input type="text" id="nombre" placeholder="Tu nombre" required />
      </label>
      <label>Correo electrónico
        <input type="email" id="correo" placeholder="correo@ejemplo.com" required />
      </label>
      <label>Contraseña
        <input type="password" id="clave" placeholder="Mínimo 6 caracteres" required />
      </label>
      <button type="submit" class="btn">Registrarme</button>
      <p id="mensaje" role="status"></p>
    </form>
  </main>

  <footer>© <span id="year"></span> Cineverse</footer>

  <script src="../js/main.js"></script>
  <script src="../js/registro.js"></script>
</body>
</html>
